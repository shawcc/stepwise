workgraph:
  id: wg-stepwise-product-v0.8
  name: Stepwise 产品工作图谱
  version: v0.8
  status: prototype_validation
  updated_at: 2026-09-16
  definition: "Stepwise 让 Human DRI 通过官方 Reasoning Agent 治理 Goal 与 Proposal，并让用户自带 Execution Agent 在授权内执行 Action。"
  core_concepts: docs/CORE_CONCEPTS.md
  current_artifacts:
    - docs/MRD.md
    - docs/PRD.md

nodes:
  - id: thesis-agent-native-organization
    type: product_thesis
    title: 少量人治理大量 Agent
    content: "少量 Human DRI 定义 Goal、授权并处理关键决策；官方 Reasoning Agent 负责提案，用户自带 Execution Agent 负责执行和回填。"

  - id: thesis-goal-entry
    type: product_thesis
    title: Goal 是工作入口
    content: "团队围绕共同 Goal 工作，IM、通知和待办只负责把注意力路由回 Goal。"

  - id: object-goal
    type: work_node
    title: Goal
    content: "希望发生的变化，也是唯一递归工作单元。组合 Goal 拥有下级 Goal；叶子 Goal 可以创建 Action。"

  - id: object-action
    type: work_node
    title: Action
    content: "对叶子 Goal 的一次真实执行，保存执行者、授权、输入、结果、Evidence 和 Decision。"

  - id: relation-decomposes
    type: relation
    title: decomposes
    content: "Goal 到 Goal 的上下级连接。"

  - id: relation-executes
    type: relation
    title: executes
    content: "叶子 Goal 到 Action 的执行连接。"

  - id: relation-goal-dependency
    type: relation
    title: goal-dependency
    content: "前置 Goal 到后续 Goal 的依赖连接。"

  - id: relation-action-dependency
    type: relation
    title: action-dependency
    content: "前置 Action 到后续 Action 的依赖连接。"

  - id: record-decomposition-review
    type: reasoning_record
    title: Decomposition Review
    content: "父 Goal 的整组拆解推演，保存数量、覆盖性、边界、候选方案和确认历史。"

  - id: view-map
    type: product_view
    title: Map
    content: "统一展示 Goal 上下级、Goal 依赖、Goal 到 Action 和 Action 依赖。"

  - id: view-goal-detail
    type: product_view
    title: Goal Detail
    content: "展示 Goal 属性、成功标准、下级、依赖、Action 和验收信息。"

  - id: view-action-detail
    type: product_view
    title: Action Detail
    content: "展示一次执行的授权、输入、结果、Evidence、依赖和 Decision。"

  - id: view-relation-deliberation
    type: product_view
    title: Relation Deliberation
    content: "保存每条连接的理由、假设、提案、确认和版本历史。"

  - id: view-decomposition-deliberation
    type: product_view
    title: Decomposition Deliberation
    content: "审查为什么是当前这组下级 Goal，而不是更多或更少。"

  - id: actor-human-dri
    type: actor
    title: Human DRI
    content: "对 Goal 成功标准、授权边界和最终验收负责。"

  - id: actor-planning-agent
    type: actor
    title: Official Reasoning Agent
    content: "Stepwise 提供的统一、可版本化推理身份；提出 Goal 拆解、依赖关系和 Action Proposal，不执行或验收。"

  - id: actor-execution-agent
    type: actor
    title: Execution Agent
    content: "由用户自带，通过 MCP、API 或 Skill 在授权范围内执行 Action 并回填结果、Evidence 和异常。"

  - id: record-goal-timebox
    type: governance_attribute
    title: Goal Timebox
    content: "保存开始时间、Deadline 和时区；时间不是工作节点，也不替代成功标准。"

  - id: record-decomposition-proposal
    type: governance_record
    title: Decomposition Proposal
    content: "官方 Reasoning Agent 的拆解建议；只有对应 Goal 的 Human DRI 确认后才创建正式下级 Goal。"

  - id: storage-server-workspace-v3
    type: prototype_infrastructure
    title: Server Workspace v3
    content: "Web 与 MCP 共享的进程内事实源，原子返回 Goal、Action、Relation 与 Decomposition Review；Serverless 冷启动和多实例下不替代生产数据库。"

  - id: cache-browser-workspace-v2
    type: prototype_infrastructure
    title: Browser Workspace Cache v2
    content: "迁移旧版字符串 Actor，并只在服务端 revision 为 0 时导入；之后仅作为故障兜底缓存。"

edges:
  - source: thesis-agent-native-organization
    target: object-goal
    relation: motivates

  - source: thesis-goal-entry
    target: view-map
    relation: defines

  - source: object-goal
    target: relation-decomposes
    relation: connects_through

  - source: object-goal
    target: relation-executes
    relation: connects_through

  - source: relation-executes
    target: object-action
    relation: creates

  - source: object-goal
    target: view-goal-detail
    relation: opens

  - source: object-goal
    target: record-decomposition-review
    relation: owns

  - source: actor-planning-agent
    target: record-decomposition-proposal
    relation: proposes

  - source: actor-human-dri
    target: record-decomposition-proposal
    relation: confirms

  - source: object-goal
    target: record-goal-timebox
    relation: governed_by

  - source: object-goal
    target: storage-server-workspace-v3
    relation: persisted_in

  - source: object-action
    target: storage-server-workspace-v3
    relation: persisted_in

  - source: storage-server-workspace-v3
    target: cache-browser-workspace-v2
    relation: cached_in

  - source: record-decomposition-review
    target: view-decomposition-deliberation
    relation: opens

  - source: object-action
    target: view-action-detail
    relation: opens

  - source: relation-decomposes
    target: view-relation-deliberation
    relation: explained_by

  - source: relation-goal-dependency
    target: view-relation-deliberation
    relation: explained_by

  - source: relation-action-dependency
    target: view-relation-deliberation
    relation: explained_by

rules:
  - "有下级 Goal 的组合 Goal 不直接创建 Action。"
  - "没有下级 Goal 的叶子 Goal 才能创建 Action。"
  - "依赖方向统一为前置节点指向后续节点。"
  - "Action 不能自行接受自己的结果。"
  - "每条 Relation 必须保存理由与推演历史。"
  - "每个组合 Goal 必须保存整组拆解的完整性与边界推演。"
  - "Official Reasoning Agent 只生成 Proposal；Human DRI 确认后才写入正式事实。"
  - "每个 Goal 必须有唯一 Human DRI、开始时间、Deadline 和时区。"
  - "Web 与 MCP 必须读写同一个服务端 Workspace store。"
  - "浏览器 v2 快照只在服务端 revision 为 0 时导入，不能覆盖已有服务端事实。"
