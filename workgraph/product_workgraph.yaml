workgraph:
  id: wg-workgraph-product-v0.3
  name: WorkGraph 产品工作图谱
  version: v0.3
  status: prototype_validation
  updated_at: 2026-08-18
  definition: "组织通过工作图谱找到共同目标，在目标工作台中工作，通过过程推演完成人与 Agent 协作，并将确认结果回写为可追溯的组织事实。"
  core_concepts: docs/CORE_CONCEPTS.md
  current_artifacts:
    - docs/MRD.md
    - docs/PRD.md
  archived_artifacts:
    - docs/archive/MRD.v0.2-legacy.md
    - docs/archive/PRD.v0.2-legacy.md
    - workgraph/archive/product_workgraph.v0.2-legacy.yaml

nodes:
  - id: thesis-agent-native-organization
    type: product_thesis
    title: 少量人治理大量 Agent
    content: "未来组织可能由少量人定义目标、授权并处理高风险决策，大量 Agent 负责分析、提案、执行、检查和回填。"
    epistemic_status: hypothesis

  - id: thesis-common-goal-entry
    type: product_thesis
    title: 共同目标是工作入口
    content: "组织级入口是工作图谱，具体工作的主入口是 Objective；IM、通知和待办只负责把注意力路由回目标。"
    epistemic_status: product_decision

  - id: thesis-result-process-version
    type: product_thesis
    title: 结果、过程与版本分离
    content: "目标工作台保存当前确认结果，过程推演保存共同工作，版本记录保存确认后的变化。"
    epistemic_status: product_decision

  - id: product-workgraph
    type: product_definition
    title: WorkGraph
    content: "面向 Agent 原生组织的递归目标执行系统，以 OKR 作为目标协议，以推理、执行、证据和治理作为内核。"

  - id: entry-attention-router
    type: product_entry
    title: 注意力路由
    content: "通知、IM 和待办提示用户哪里需要关注或决策，但不保存正式工作事实。"
    visibility: future

  - id: entry-work-map
    type: product_entry
    title: 工作图谱
    content: "组织级导航，展示权限范围内的 Objective 层级，支持逐层进入和返回。"
    visibility: primary

  - id: entry-objective-workspace
    type: product_entry
    title: 目标工作台
    content: "具体工作的主入口，以递归文档展示当前 Objective 已确认的工作事实。"
    visibility: primary

  - id: entry-process-deliberation
    type: product_entry
    title: 过程推演
    content: "锚定到章节或结论的结构化事件流，保存问题、AI 分析、提案、审查和决策。"
    visibility: contextual

  - id: view-version-record
    type: product_view
    title: 版本记录
    content: "保存每次确认前后的差异、依据、参与者和时间。"
    visibility: contextual

  - id: view-dependencies
    type: derived_view
    title: 依赖视图
    content: "从 Objective、Initiative 和 Action 的依赖关系派生。"
    visibility: hidden_in_prototype

  - id: view-evidence
    type: derived_view
    title: 证据视图
    content: "从 Evidence 与 KR、条件和 Outcome 的关系派生。"
    visibility: hidden_in_prototype

  - id: view-monitor
    type: derived_view
    title: 运行监控
    content: "从执行状态、风险、阻塞和 Agent 事件派生。"
    visibility: hidden_in_prototype

  - id: view-timeline
    type: derived_view
    title: 时间线
    content: "从过程事件和版本记录派生。"
    visibility: hidden_in_prototype

  - id: object-objective
    type: core_object
    title: Objective
    content: "希望发生的变化，也是唯一递归目标单元。"

  - id: object-key-result
    type: core_object
    title: Key Result
    content: "判断所属 Objective 是否达成的可衡量或可验证结果标准。"

  - id: object-necessary-condition
    type: core_object
    title: Necessary Condition
    content: "Objective 成立不可缺少的待验证因果条件。"

  - id: object-initiative
    type: core_object
    title: Initiative
    content: "为创造一个或多个必要条件而组织的一组工作。"

  - id: object-action
    type: core_object
    title: Action
    content: "可直接执行的最小工作单元。"

  - id: object-outcome
    type: core_object
    title: Outcome
    content: "Action 或 Initiative 实际产生的结果。"

  - id: object-evidence
    type: core_object
    title: Evidence
    content: "支持或反驳 KR、必要条件和 Outcome 的可追溯事实。"

  - id: process-review
    type: process
    title: Review
    content: "用 Evidence 核验 KR、必要条件和 Outcome，并形成 Decision。"

  - id: object-decision
    type: core_object
    title: Decision
    content: "审查后形成的接受、调整、重做或停止等正式判断。"

  - id: actor-human
    type: actor
    title: Human
    content: "负责目标、授权、价值判断和高风险决策。"

  - id: actor-agent
    type: actor
    title: Agent
    content: "读取上下游和方法，分析、提出修改、执行检查并回填结果；默认不能直接改写正式结果。"

  - id: workflow-core-loop
    type: workflow
    title: 最小工作闭环
    content: "工作图谱 -> 目标工作台 -> 过程推演 -> Agent 提案 -> 人工审查 -> 确认写入 -> 生成版本。"

  - id: governance-proposal-first
    type: governance_rule
    title: 提案优先
    content: "Agent 输出先进入草稿和过程推演，只有经过授权确认才能写入正式目标文档。"

  - id: governance-evidence
    type: governance_rule
    title: 证据验收
    content: "Action 完成不等于 Objective 达成，必须由 Evidence 核验 Key Results。"

  - id: requirement-map
    type: current_requirement
    title: 递归工作图谱
    content: "支持 Objective 逐层展开；地图下钻保持地图模式，只有明确操作才进入目标工作台。"

  - id: requirement-workspace
    type: current_requirement
    title: 递归目标文档
    content: "目标工作台展示当前 Objective 的 KR、必要条件、路线、执行结果和审查决策，下级 Objective 作为内嵌文档继续递归。"

  - id: requirement-deliberation
    type: current_requirement
    title: 结论级过程推演
    content: "章节和关键结论均能打开过程推演，查看历史事件、统计、提案、决策和版本变化。"

  - id: requirement-confirmation
    type: current_requirement
    title: 确认回写
    content: "用户采用或编辑 Agent 提案后确认写入正式文档，系统生成版本和 Decision 事件。"

