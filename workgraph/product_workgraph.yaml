acceptance_criteria:
  - "一级工作入口只突出工作图谱和目标工作台。"
  - "Objective 是唯一递归目标单元，界面不再向用户暴露 Goal、SubGoal 或 Work Unit。"
  - "目标工作台只呈现当前确认结果，过程推演保存共同工作，版本记录保存确认变化。"
  - "Agent 提案未经授权确认不得覆盖正式结果。"
  - "任一正式结论都能追溯到对应过程和版本。"
  - "依赖、证据、监控和时间线保留为派生视图，但在原型中不与主入口并列。"
