acceptance_criteria:
  - id: ac-001
    description: "任何产品需求必须能追溯到目标、市场机会或产品原则。"
    related_nodes:
      - product-001
      - thesis-001

  - id: ac-002
    description: "MRD 和 PRD 必须被视为图谱导出视图，不得作为主事实源。"
    related_nodes:
      - artifact-001
      - artifact-002

  - id: ac-003
    description: "新增需求必须以节点和关系形式进入图谱，再按需导出为文档。"
    related_nodes:
      - thesis-001
      - product-001

  - id: ac-004
    description: "关键推理必须记录 f(x)：输入信息、推理过程、阶段结论和后验反馈都应可追溯。"
    related_nodes:
      - thesis-002
      - object-010
      - object-011
      - object-012

  - id: ac-005
    description: "任何人和 Agent 的工作单元都必须能向上追溯来源目标、推理依据、假设和约束。"
    related_nodes:
      - thesis-003
      - object-013
      - requirement-010

  - id: ac-006
    description: "下游失败、依赖阻塞、证据不足或假设失效必须能向上触发 Review 回流，并保留新旧链路差异。"
    related_nodes:
      - thesis-004
      - object-014
      - flow-003
      - requirement-010
